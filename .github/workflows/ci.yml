name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second merge shouldn't deploy over a deploy still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Migrations stay manual (`npm run db:migrate`): they are rare, and ordering one against a
      # deploy is fiddly enough that a late migration beats a wrong one.
      - name: Deploy
        if: github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
